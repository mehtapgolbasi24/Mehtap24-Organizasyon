<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı | Mehtap Organizasyon</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E8C4C4; --pink-deep:#B87878; --pink-pale:#F3E2E0;
    --gray:#3A3A3F; --gray-soft:#8B8790; --cream:#FAF7F5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--cream);
    color:var(--gray);
    font-family:'Jost',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
  }
  .wrap{max-width:480px;}
  .num{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:120px;
    color:var(--pink-deep);
    line-height:1;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:30px;
    margin-top:10px;
  }
  p{
    margin-top:16px;
    color:var(--gray-soft);
    font-size:15px;
    line-height:1.7;
  }
  a.btn{
    display:inline-block;
    margin-top:30px;
    background:var(--gray);
    color:var(--cream);
    padding:14px 30px;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border-radius:2px;
    text-decoration:none;
    transition:background .3s;
  }
  a.btn:hover{background:var(--pink-deep);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="num">404</div>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Ana sayfaya dönerek hizmetlerimize göz atabilirsiniz.</p>
    <a class="btn" href="/">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
